name: luptok
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  gal: ^2.3.3
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: IMFellFrenchCanon
      fonts:
        - asset: assets/fonts/IMFellFrenchCanon-Regular.ttf
  assets:
    - assets/images/
    - assets/images/logobranca.png

